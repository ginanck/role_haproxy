---
# handlers file for role_haproxy

- name: validate haproxy config
  ansible.builtin.command:
    cmd: haproxy -c -f {{ haproxy_destination_config_path }}
  changed_when: false

- name: reload haproxy
  ansible.builtin.service:
    name: "haproxy"
    state: reloaded

- name: restart haproxy
  ansible.builtin.service:
    name: "haproxy"
    state: restarted

- name: restart rsyslog
  ansible.builtin.service:
    name: "rsyslog"
    state: restarted
  when: ansible_facts['virtualization_type'] not in ['container', 'docker']

- name: reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true
