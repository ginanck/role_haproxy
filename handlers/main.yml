---
# handlers file for role_haproxy

- name: validate haproxy config
  ansible.builtin.command:
    cmd: haproxy -c -f {{ haproxy_destination_config_path }}
  changed_when: false

- name: reload haproxy
  ansible.builtin.service:
    name: "haproxy"
    state: reloaded
  register: haproxy_reload_result
  ignore_errors: true

- name: show haproxy logs on failure
  ansible.builtin.command:
    cmd: journalctl -u haproxy -n 50 --no-pager
  register: haproxy_journal
  changed_when: false
  when: haproxy_reload_result is defined and haproxy_reload_result.failed
  listen: reload haproxy

- name: display haproxy logs
  ansible.builtin.debug:
    msg: "{{ haproxy_journal.stdout_lines }}"
  when: haproxy_reload_result is defined and haproxy_reload_result.failed
  listen: reload haproxy

- name: fail on reload error
  ansible.builtin.fail:
    msg: "HAProxy reload failed. See logs above."
  when: haproxy_reload_result is defined and haproxy_reload_result.failed
  listen: reload haproxy

- name: restart rsyslog
  ansible.builtin.service:
    name: "rsyslog"
    state: restarted
