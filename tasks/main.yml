---
# tasks file for role_haproxy

- name: Check Packages
  ansible.builtin.package_facts:
    manager: auto

- name: Install HAProxy Package from Repository
  vars:
    supported_os: ["RedHat", "Debian"]
  ansible.builtin.include_tasks: "install-{{ ansible_os_family }}.yml"
  when: ansible_os_family in supported_os

# ----------------------------------------------------------------
# Directory setup
# ----------------------------------------------------------------

- name: Create Certificate Folder
  ansible.builtin.file:
    path: "{{ haproxy_cert_dir }}"
    state: directory
    owner: root
    group: root
    mode: 0644
  when: haproxy_cert_name | length > 0

- name: Copy Certificate to Host
  ansible.builtin.copy:
    src: "{{ haproxy_cert_name }}"
    dest: "{{ haproxy_cert_dir }}/{{ haproxy_cert_name }}"
    owner: root
    group: root
    mode: 0644
  when: haproxy_cert_name | length > 0

- name: Create Whitelist Folder
  ansible.builtin.file:
    path: "{{ haproxy_whitelist_file_dir }}"
    state: directory
    owner: root
    group: root
    mode: 0644
  when: haproxy_whitelist_file_name | length > 0

- name: Copy Whitelist File to Host
  ansible.builtin.copy:
    src: "{{ haproxy_whitelist_file_name }}"
    dest: "{{ haproxy_whitelist_file_dir }}/{{ haproxy_whitelist_file_name }}"
    owner: root
    group: root
    mode: 0644
  when: haproxy_whitelist_file_name | length > 0

# ----------------------------------------------------------------
# Network routing (multi-interface / policy routing)
# ----------------------------------------------------------------

- name: Include Network Routing Tasks
  ansible.builtin.include_tasks: routing.yml

# ----------------------------------------------------------------
# Runtime API socket directory
# ----------------------------------------------------------------

- name: Create runtime API socket directory
  ansible.builtin.file:
    path: "{{ haproxy_stats.runtime_api.socket | dirname }}"
    state: directory
    owner: "{{ haproxy_global.user | default('haproxy') }}"
    group: "{{ haproxy_global.group | default('haproxy') }}"
    mode: "0755"
  when: haproxy_stats.runtime_api.enabled | default(false)

# ----------------------------------------------------------------
# SSL / TLS: Let's Encrypt certificate management
# ----------------------------------------------------------------

- name: Include SSL certificate tasks
  ansible.builtin.include_tasks: ssl.yml
  when: haproxy_letsencrypt.enabled | default(false)

# ----------------------------------------------------------------
# Configuration rendering
# ----------------------------------------------------------------

- name: Configure haproxy using haproxy.cfg
  ansible.builtin.template:
    src: haproxy.cfg.j2
    dest: "{{ haproxy_destination_config_path }}"
    owner: root
    group: root
    mode: 0644
  notify:
    - validate haproxy config
    - reload haproxy

# ----------------------------------------------------------------
# Post-deploy validation
# ----------------------------------------------------------------

- name: Run pre-flight validation checks
  ansible.builtin.include_tasks: validation.yml
