---
# tasks/ssl.yml - Let's Encrypt certificate combining and HAProxy PEM generation

- name: Create HAProxy SSL cert directory
  ansible.builtin.file:
    path: "{{ haproxy_ssl.cert_dir }}"
    state: directory
    owner: root
    group: "{{ haproxy_global.group | default('haproxy') }}"
    mode: "0750"

- name: Combine Let's Encrypt certs into HAProxy PEM format
  # Concatenates fullchain.pem + privkey.pem into a single PEM file that
  # HAProxy can consume for SSL termination.
  ansible.builtin.shell:
    cmd: >
      cat "{{ haproxy_letsencrypt.cert_dir }}/{{ item }}/fullchain.pem"
          "{{ haproxy_letsencrypt.cert_dir }}/{{ item }}/privkey.pem"
          > "{{ haproxy_ssl.cert_dir }}/{{ item }}.pem"
  args:
    creates: "{{ haproxy_ssl.cert_dir }}/{{ item }}.pem"
  loop: "{{ haproxy_letsencrypt.domains }}"
  loop_control:
    label: "{{ item }}"
  notify: reload haproxy

- name: Set correct permissions on HAProxy PEM files
  ansible.builtin.file:
    path: "{{ haproxy_ssl.cert_dir }}/{{ item }}.pem"
    owner: root
    group: "{{ haproxy_global.group | default('haproxy') }}"
    mode: "0640"
  loop: "{{ haproxy_letsencrypt.domains }}"
  loop_control:
    label: "{{ item }}"

- name: Install Let's Encrypt renewal deploy-hook for HAProxy
  # This hook recombines certs after every successful renewal and reloads HAProxy.
  ansible.builtin.copy:
    dest: /etc/letsencrypt/renewal-hooks/deploy/haproxy-combine.sh
    owner: root
    group: root
    mode: "0755"
    content: |
      #!/bin/bash
      # Auto-generated by Ansible role_haproxy — do not edit manually.
      # Recombines Let's Encrypt certs into HAProxy PEM files after renewal.
      set -euo pipefail

      CERT_DIR="{{ haproxy_letsencrypt.cert_dir }}"
      HAPROXY_CERT_DIR="{{ haproxy_ssl.cert_dir }}"

      for domain in {{ haproxy_letsencrypt.domains | join(' ') }}; do
        if [[ -f "${CERT_DIR}/${domain}/fullchain.pem" && -f "${CERT_DIR}/${domain}/privkey.pem" ]]; then
          cat "${CERT_DIR}/${domain}/fullchain.pem" \
              "${CERT_DIR}/${domain}/privkey.pem" \
              > "${HAPROXY_CERT_DIR}/${domain}.pem"
          chmod 640 "${HAPROXY_CERT_DIR}/${domain}.pem"
          chown root:{{ haproxy_global.group | default('haproxy') }} "${HAPROXY_CERT_DIR}/${domain}.pem"
          echo "Updated HAProxy PEM for ${domain}"
        else
          echo "WARNING: cert files not found for ${domain}, skipping." >&2
        fi
      done

      systemctl reload haproxy
  when: haproxy_letsencrypt.deploy_hook | default(true)
