---
# tasks/validation.yml - Pre-flight validation checks

- name: Assert haproxy_global is defined and sane
  ansible.builtin.assert:
    that:
      - haproxy_global is defined
      - haproxy_global.maxconn is defined
      - haproxy_global.maxconn | int > 0
      - haproxy_global.chroot is defined
    fail_msg: "haproxy_global.maxconn and chroot must be defined and maxconn must be > 0"

- name: Assert haproxy_defaults mode is valid
  ansible.builtin.assert:
    that:
      - haproxy_defaults.mode in ['http', 'tcp']
    fail_msg: "haproxy_defaults.mode must be 'http' or 'tcp', got: {{ haproxy_defaults.mode }}"

- name: Assert frontend modes are valid
  ansible.builtin.assert:
    that:
      - item.mode in ['http', 'tcp']
    fail_msg: "Frontend '{{ item.name }}' mode must be 'http' or 'tcp', got: {{ item.mode }}"
  loop: "{{ haproxy_frontend | default([]) }}"
  loop_control:
    label: "{{ item.name }}"

- name: Assert backend modes are valid
  ansible.builtin.assert:
    that:
      - item.mode in ['http', 'tcp']
    fail_msg: "Backend '{{ item.name }}' mode must be 'http' or 'tcp', got: {{ item.mode }}"
  loop: "{{ haproxy_backend | default([]) }}"
  loop_control:
    label: "{{ item.name }}"

- name: Assert stats auth credentials when stats + auth enabled
  ansible.builtin.assert:
    that:
      - haproxy_stats.auth.username | length > 0
      - haproxy_stats.auth.password | length > 0
    fail_msg: "haproxy_stats.auth.username and haproxy_stats.auth.password must be set when stats auth is enabled"
  when:
    - haproxy_stats.enabled | default(false)
    - haproxy_stats.auth.enabled | default(false)

- name: Assert peers list is non-empty when HA peers enabled
  ansible.builtin.assert:
    that:
      - (haproxy_peers.peers | default(haproxy_peers.list | default([]))) | length > 0
    fail_msg: "haproxy_peers.peers must contain at least one peer when haproxy_peers.enabled is true"
  when: haproxy_peers.enabled | default(false)

- name: Assert rate limit tables reference existing stick tables
  ansible.builtin.assert:
    that:
      - item.table in (haproxy_stick_tables | default([]) | map(attribute='name') | list)
    fail_msg: "haproxy_rate_limits entry references table '{{ item.table }}' which is not defined in haproxy_stick_tables"
  loop: "{{ haproxy_rate_limits | default([]) }}"
  loop_control:
    label: "{{ item.table }}"

- name: Assert static routes have required fields
  ansible.builtin.assert:
    that:
      - item.destination is defined and item.destination != ''
      - item.gateway is defined and item.gateway != ''
    fail_msg: "haproxy_network_routes entry must define 'destination' and 'gateway', got: {{ item }}"
  loop: "{{ haproxy_network_routes | default([]) }}"
  loop_control:
    label: "{{ item.destination | default('MISSING') }}"

- name: Assert policy routing tables have required fields
  ansible.builtin.assert:
    that:
      - item.name is defined and item.name != ''
      - item.number is defined and item.number | int > 0
      - item.source is defined and item.source != ''
      - item.gateway is defined and item.gateway != ''
    fail_msg: "haproxy_policy_routing.tables entry must define name, number (>0), source, and gateway, got: {{ item }}"
  loop: "{{ haproxy_policy_routing.tables | default([]) }}"
  loop_control:
    label: "{{ item.name | default('MISSING') }}"
  when: haproxy_policy_routing.enabled | default(false)

- name: Assert policy routing table numbers are unique
  ansible.builtin.assert:
    that:
      - (haproxy_policy_routing.tables | map(attribute='number') | list | unique | length) == (haproxy_policy_routing.tables | length)
    fail_msg: "haproxy_policy_routing.tables contain duplicate table numbers"
  when:
    - haproxy_policy_routing.enabled | default(false)
    - haproxy_policy_routing.tables | default([]) | length > 1

- name: Validate HAProxy configuration syntax
  ansible.builtin.command:
    cmd: "haproxy -c -f {{ haproxy_destination_config_path }}"
  changed_when: false
  register: haproxy_config_syntax_check
  failed_when: haproxy_config_syntax_check.rc != 0
